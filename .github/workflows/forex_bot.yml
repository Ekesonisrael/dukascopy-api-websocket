name: Forex Gold Bot
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Dependencies
        run: pip install tickerall pandas requests
      
      - name: Run Forex Bot
        env:
          TICKERALL_API_KEY: ${{ secrets.TICKERALL_API_KEY }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_ACCOUNT: ${{ secrets.MT5_ACCOUNT }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python forex_bot.py
      
      - name: Save Journal
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add forex_journal.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update forex journal [skip ci]"
          git push || true
