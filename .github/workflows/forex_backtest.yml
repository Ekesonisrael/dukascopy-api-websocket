name: Run Forex Backtest

on:
  workflow_dispatch: # This allows you to run it manually with a button click
  # (Optional) Uncomment the lines below if you want it to run automatically once a week on Sundays
  # schedule:
  #   - cron: '0 0 * * 0'

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Installing the required packages directly to ensure it works even if requirements.txt isn't updated
          pip install pandas numpy yfinance

      - name: Run Forex Backtest Script
        run: python backtest_forex.py
