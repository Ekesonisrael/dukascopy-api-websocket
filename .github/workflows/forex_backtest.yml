name: Run Forex Backtest

on:
  workflow_dispatch: 

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      # 🛑 DEBUG STEP: This will list every file the runner sees
      - name: List Files
        run: ls -la

      - name: Run Forex Backtest Script
        run: python backtest_forex.py
